  - pandas
  - numpy=1.26
  - dask
  - scipy
  - requests
  - matplotlib
  - geopy
  - tk
  - netcdf4
  - s3fs
  - xarray
  - zarr
  - tqdm
  - simplekml
  - pypdf
  - pyinstaller=6.9.0
