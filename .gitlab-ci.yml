stages:
  - test
  - build

python_sast_windows:
  stage: test
  script:
    - Write-Host "Installing Bandit SAST Analyzer..."
    - pip install bandit
    - Write-Host "Running SAST scan on Python files..."
    - bandit -r . -ll -ii
  allow_failure: true

pyinstaller_build:
  stage: build
  variables:
    CONDA_ENV_NAME: "apt-v3-1"
  script:
    - Write-Host "Locating Conda installation..."
    - |
      $CondaExe = (Get-Command conda -ErrorAction SilentlyContinue).Source
      if (-not $CondaExe) {
          $StandardPaths = @(
              "$env:USERPROFILE\AppData\Local\miniconda3\condabin\conda.bat",
              "$env:USERPROFILE\miniconda3\condabin\conda.bat",
              "$env:USERPROFILE\anaconda3\condabin\conda.bat",
              "C:\ProgramData\miniconda3\condabin\conda.bat",
              "C:\ProgramData\anaconda3\condabin\conda.bat"
          )
          foreach ($Path in $StandardPaths) {
              if (Test-Path $Path) {
                  $CondaExe = $Path
                  break
              }
          }
      }
    - |
      if (-not $CondaExe) {
          Write-Error "Conda was not found on this machine. Ensure Miniconda or Anaconda is installed."
          exit 1
      } else {
          Write-Host "Conda located at: $CondaExe"
      }

    - Write-Host "Building Conda Environment..."
    # Using the pipe (|) safely executes the PowerShell call operator (&)
    - |
      & $CondaExe env create -f environment.yml --name $env:CONDA_ENV_NAME
    
    - Write-Host "Executing PyInstaller within Conda Environment..."
    - |
      & $CondaExe run -n $env:CONDA_ENV_NAME pyinstaller main_ex.spec --noconfirm
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
